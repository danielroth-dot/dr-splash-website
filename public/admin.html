<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Dr. Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/assets/dr-splash-flat.png" type="image/png" />
</head>
<body class="admin-body">
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/assets/dr-splash-flat.png" alt="" width="40" height="40" />
      <span>Dr. Splash Admin</span>
    </a>
    <nav>
      <a href="/">Zur Website</a>
      <button type="button" id="logout-btn" class="btn ghost small hidden">Abmelden</button>
    </nav>
  </header>

  <main class="admin-main">
    <section id="login-panel" class="panel narrow">
      <div class="panel-head">
        <h1>Admin Login</h1>
        <p>Passwortgeschuetzter Bereich zur Moderation von Feedback.</p>
      </div>
      <form id="login-form" class="feedback-form">
        <label>
          <span>Passwort</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn primary wide">Anmelden</button>
        <p class="form-status" id="login-status" role="status"></p>
      </form>
    </section>

    <section id="mod-panel" class="panel hidden">
      <div class="panel-head row">
        <div>
          <h1>Feedback moderieren</h1>
          <p>Freigeben, ablehnen oder loeschen.</p>
        </div>
        <div class="filters">
          <button type="button" class="chip active" data-filter="all">Alle</button>
          <button type="button" class="chip" data-filter="pending">Ausstehend</button>
          <button type="button" class="chip" data-filter="approved">Freigegeben</button>
          <button type="button" class="chip" data-filter="rejected">Abgelehnt</button>
        </div>
      </div>
      <div id="admin-list" class="admin-list">
        <p class="muted">Lade…</p>
      </div>
    </section>
  </main>

  <script src="/admin.js" defer></script>
</body>
</html>
